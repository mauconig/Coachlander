appId: com.coachlander.tempo
---
- launchApp
- runFlow:
    when:
      visible: "Iniciar sesión"
    commands:
      - tapOn: "Iniciar sesión"
- tapOn:
    id: auth-email
- inputText: ${E2E_ATHLETE_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${E2E_ATHLETE_PASSWORD}
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible: "Hoy"
    timeout: 15000
- takeScreenshot: e2e-athlete-authenticated
