appId: com.coachlander.tempo
---
- launchApp
- extendedWaitUntil:
    visible: "Hoy"
    timeout: 15000
- tapOn:
    id: today-start-session
- extendedWaitUntil:
    visible:
      id: session-primary-cta
    timeout: 10000
- tapOn:
    id: session-primary-cta
- tapOn:
    id: session-primary-cta
- tapOn:
    id: session-use-suggested
- tapOn:
    id: "Minimizar sesión"
- assertVisible:
    id: mini-session-player
- takeScreenshot: e2e-session-minimized
- tapOn:
    id: mini-session-player
- assertVisible:
    id: session-primary-cta
- pressKey: HOME
- launchApp
- assertVisible:
    id: session-primary-cta
- takeScreenshot: e2e-session-restored
